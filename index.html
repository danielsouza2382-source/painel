<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu painel</title>
<meta name="description" content="Agenda, finanças, faculdade, trabalho e hábitos num só lugar.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f1ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE  calm personal planner: quick to scan, nothing shouting
   IDEA   a ring-bound planner with coloured divider tabs, one colour per area of life
   PICTURE today's schedule with large hanging times; real day/week/month grids; exam countdowns
   COLOUR warm paper white, near-black ink, coral for "today", one flat colour per tab
   TYPE Manrope with tabular numbers; LAYOUT side tabs on desktop, bottom tabs on phone */
:root{color-scheme:light dark;
--bg:light-dark(#f2f1ed,#0f1113);--sf:light-dark(#fff,#171a1e);--sf2:light-dark(#f7f6f2,#1f2328);
--ink:light-dark(#16181b,#eceae5);--mu:light-dark(#61656c,#9ea3aa);--ln:light-dark(#e2e0da,#2b3036);
--now:light-dark(#e5482d,#ff6b4f);--onnow:light-dark(#fff,#1a0800);
--ag:light-dark(#2f5bea,#7896ff);--fin:light-dark(#0f8a60,#3ec58f);--fac:light-dark(#d89300,#f2b632);
--trab:light-dark(#d12f5f,#f26592);--hab:light-dark(#6a4de4,#a38fff);--gray:light-dark(#858a91,#7d838b);
--bad:light-dark(#d33a2c,#ff6b5e);--onc:light-dark(#fff,#0f1113)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums;--ac:var(--ink);--onac:var(--bg)}
body[data-v=agenda]{--ac:var(--ag);--onac:var(--onc)}body[data-v=financas]{--ac:var(--fin);--onac:var(--onc)}
body[data-v=faculdade]{--ac:var(--fac);--onac:#241a00}body[data-v=trabalho]{--ac:var(--trab);--onac:var(--onc)}body[data-v=habitos]{--ac:var(--hab);--onac:var(--onc)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mu{color:var(--mu)}.neg{color:var(--bad)}.pos{color:var(--fin)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--gray));flex:none}
/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;padding:22px 14px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:4px;background:var(--sf)}
.brand{padding:2px 10px 18px}.brand b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em}.brand span{color:var(--mu);font-size:13px}
.nav{display:flex;flex-direction:column;gap:3px}.sidefoot{margin-top:auto}
.nv{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:12px;font-weight:600;color:var(--mu);min-height:46px;text-decoration:none;width:100%}
.nv i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.nv:hover{background:var(--sf2);color:var(--ink)}
.nv.on{background:color-mix(in srgb,var(--c) 9%,var(--sf));color:var(--ink)}
.nv.on i{background:var(--c);color:var(--o,var(--onc))}
.main{padding:0 clamp(16px,3vw,40px) 120px;width:100%;max-width:1300px}
.top{display:flex;align-items:center;gap:10px;padding:calc(20px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;z-index:20;background:var(--bg)}
.tt{flex:1}.kick{margin:0;color:var(--mu);font-weight:600;font-size:14px}.kick:empty{display:none}
.top h1{font-size:clamp(25px,3vw,36px);line-height:1.08;margin:0;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--mu);padding:0 12px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);min-height:36px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--gray))}
.sync[data-s=load] i,.sync[data-s=saving] i{animation:pl .9s infinite alternate}
@keyframes pl{to{opacity:.25}}
.gear{display:none}
.tabbar{display:none}
.fab{display:none}
@media(max-width:899px){
 .app{grid-template-columns:minmax(0,1fr)}.side{display:none}.top .gear{display:grid}.top .addb{display:none}
 .main{padding-bottom:150px}.top{padding:calc(14px + env(safe-area-inset-top)) 0 8px}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--mu);text-decoration:none;min-height:50px;justify-content:center;white-space:nowrap;overflow:hidden}
 .tb i{width:44px;height:28px;border-radius:99px;display:grid;place-items:center}
 .tb.on{color:var(--ink)}.tb.on i{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
 .fab{display:grid;position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:18px;background:var(--ac);color:var(--onac);place-items:center;box-shadow:0 8px 24px rgb(0 0 0/.22)}
 .fab .ic{width:26px;height:26px;stroke-width:2.2}
}
@media(max-width:430px){.sync .t{display:none}.sync{padding:0 13px}}
/* pieces */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px}
.card>header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card h2,.card h3{margin:0;font-size:17px;font-weight:750;flex:1;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;background:var(--ac);color:var(--onac);white-space:nowrap}
.btn .ic{width:18px;height:18px;stroke-width:2.3}
.btn.ghost{background:var(--sf2);color:var(--ink);border:1px solid var(--ln)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--sf2)}
.lnk{color:var(--mu);font-weight:700;font-size:14px;padding:0 6px;border-radius:8px;min-height:40px;display:inline-flex;align-items:center}
.lnk:hover{color:var(--ink)}
.seg{display:inline-flex;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:38px;padding:0 14px;border-radius:9px;font-weight:650;color:var(--mu);font-size:14px;white-space:nowrap}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.empty{color:var(--mu);padding:14px 0;font-size:14.5px;list-style:none}
.note{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--fac) 16%,var(--sf));border:1px solid color-mix(in srgb,var(--fac) 40%,transparent);margin-bottom:14px;font-size:14.5px}
.note span{flex:1 1 260px}
.loading{padding:10px 14px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);color:var(--mu);font-weight:600;font-size:14px;margin-bottom:14px}
.bar{height:10px;border-radius:99px;background:var(--sf2);overflow:hidden;border:1px solid var(--ln)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--ac))}
.big{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.025em;line-height:1.1;white-space:nowrap;display:block}
.sub{color:var(--mu);font-size:14.5px;margin:-4px 0 14px}
/* hoje */
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 16px}
.stat{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);font-size:14px;font-weight:650;white-space:nowrap}
.dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.colst{display:grid;gap:16px}
@media(max-width:1050px){.dash{display:flex;flex-direction:column}.colst{display:contents}.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:0 -6px 8px}
.wsd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;min-height:70px}
.wsd>span{font-size:13px;color:var(--mu);font-weight:600}
.wsd b{font-size:17px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-weight:750}
.wsd.td b{background:var(--now);color:var(--onnow)}
.wsd:hover{background:var(--sf2)}
.dots{display:flex;gap:3px;height:6px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--ag)}
.tl{list-style:none;margin:0;padding:0}
.tl>li{border-top:1px solid var(--ln)}.tl>li:first-child{border-top:0}
.tlr{display:grid;grid-template-columns:78px minmax(0,1fr);gap:14px;padding:13px 0;width:100%;text-align:left;align-items:start}
.tl-t{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.tl-t small{display:block;font-size:13px;color:var(--mu);font-weight:600;letter-spacing:0;margin-top:4px}
.tl-b{display:grid;gap:2px}.tl-b b{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:9px}
.tl-b>span{font-size:14px}
.tlr.past{opacity:.45}.tlr.nowr .tl-t{color:var(--now)}
.nowt{font-style:normal;color:var(--now);font-weight:800}
.tmr{margin:6px 0 0;padding-top:12px;border-top:1px dashed var(--ln);font-size:14px;color:var(--mu)}.tmr b{color:var(--ink)}
.hpills{display:flex;flex-wrap:wrap;gap:8px}
.hp{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--c) 40%,var(--ln));font-weight:650;font-size:14px}
.hp .ck{width:28px;height:28px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);display:grid;place-items:center}
.hp.on{background:color-mix(in srgb,var(--c) 13%,var(--sf))}.hp.on .ck{background:var(--c);border-color:var(--c);color:#fff}
.hp .ic,.hc .ic,.cb .ic{width:16px;height:16px;stroke-width:2.8}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14.5px}.mrow b{white-space:nowrap}
.msplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:10px}.msplit .big{font-size:clamp(22px,2.3vw,30px)}
/* tasks */
.tks{list-style:none;margin:0;padding:0}
.tk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln)}
.tks>.tk:first-child{border-top:0}
.cb{width:26px;height:26px;border-radius:8px;border:2px solid color-mix(in srgb,var(--ink) 25%,transparent);display:grid;place-items:center;flex:none;margin-top:1px;position:relative}
.cb::after{content:"";position:absolute;inset:-9px}
.cb:hover{border-color:var(--fin)}
.tk.done .cb{background:var(--fin);border-color:var(--fin);color:#fff}
.tkb{flex:1;text-align:left;display:grid;gap:2px}
.tkb b{font-weight:650;font-size:15.5px}
.tk.done .tkb b{text-decoration:line-through;color:var(--mu)}
.tkm{font-size:13.5px;color:var(--mu);display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.tkm>span{display:inline-flex;align-items:center;gap:6px}
.late{color:var(--bad);font-weight:700}
.grp>h3{font-size:14px;color:var(--mu);font-weight:750;margin:18px 0 2px;display:flex;gap:8px;align-items:center}
.grp:first-child>h3{margin-top:0}
.grp>h3.bad{color:var(--bad)}
details summary{cursor:pointer;font-weight:700;color:var(--mu);font-size:14px;padding:14px 0 4px;min-height:44px}
/* agenda */
.tbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.tbar h2{font-size:22px;font-weight:800;margin:0;flex:1 1 200px;letter-spacing:-.02em;white-space:nowrap}
.navd{display:flex;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:8px;font-size:13px;font-weight:650;background:color-mix(in srgb,var(--c) 16%,var(--sf));max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-height:28px;text-align:left}
.chip .ic{width:14px;height:14px;stroke-width:2.6}
.chip.done{text-decoration:line-through;opacity:.6}
.adr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tgwrap{max-height:min(70vh,780px);overflow:auto;border:1px solid var(--ln);border-radius:16px;background:var(--sf);position:relative;overscroll-behavior:contain}
.tg{display:grid;grid-template-columns:52px minmax(0,1fr);padding:10px 0;box-sizing:content-box}
.hrs{position:relative}
.hrs span{position:absolute;right:8px;transform:translateY(-50%);font-size:13px;color:var(--mu);font-weight:600;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));background:repeating-linear-gradient(to bottom,var(--ln) 0 1px,transparent 1px var(--hh));position:relative}
.dcol{position:relative;border-left:1px solid var(--ln);cursor:copy}
.dcol.is-today{background:color-mix(in srgb,var(--now) 5%,transparent)}
.ev{position:absolute;border-radius:8px;padding:3px 7px;text-align:left;overflow:hidden;background:color-mix(in srgb,var(--c) 20%,var(--sf));border:1px solid color-mix(in srgb,var(--c) 50%,transparent);font-size:13px;line-height:1.25;display:flex;flex-direction:column;cursor:pointer;z-index:2}
.ev b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev span{color:var(--mu);white-space:nowrap;overflow:hidden}
.ev:hover{background:color-mix(in srgb,var(--c) 30%,var(--sf))}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.wkh{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--ln);display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr))}
.wkd{display:flex;flex-direction:column;align-items:center;padding:8px 2px 4px;border-left:1px solid var(--ln);gap:1px}
.wkd span{font-size:13px;color:var(--mu);font-weight:600}
.wkd b{font-size:18px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-weight:750}
.wkd.td b{background:var(--now);color:var(--onnow)}.wkd:hover b{background:var(--sf2)}.wkd.td:hover b{background:var(--now)}
.wkg{font-size:13px;color:var(--mu);text-align:right;padding:6px 8px 6px 0;line-height:1.1}
.wka{display:flex;flex-direction:column;gap:3px;padding:4px;border-left:1px solid var(--ln);min-height:10px}
.wl{display:grid;gap:10px}
.wld{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px}
.wlh{display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:flex-start}
.wlh b{font-size:25px;font-weight:800;line-height:1.1;letter-spacing:-.02em}.wlh span{font-size:13px;color:var(--mu);font-weight:600}
.wld.td .wlh b{color:var(--now)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.wli{display:flex;gap:10px;align-items:center;text-align:left;padding:5px 0;min-height:36px;width:100%}
.wli time{font-weight:750;white-space:nowrap;font-size:14px;width:46px;flex:none}
.wli span{flex:1}.wli small{color:var(--mu);font-size:13px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--ln);border-radius:16px;overflow:hidden;background:var(--sf)}
.mh{padding:8px 4px;font-size:13px;color:var(--mu);font-weight:650;text-align:center;border-bottom:1px solid var(--ln)}
.mc{min-height:108px;padding:6px;border-left:1px solid var(--ln);border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;align-items:stretch}
.mg>.mc:nth-child(7n+1){border-left:0}
.mg>.mc:nth-child(-n+14){border-top:0}
.mc.out{color:var(--mu);background:var(--sf2)}
.mc:hover{background:color-mix(in srgb,var(--ac) 5%,var(--sf))}
.mn{font-weight:750;font-size:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.mc.td .mn{background:var(--now);color:var(--onnow)}
.mc.sel{box-shadow:inset 0 0 0 2px var(--ac)}
.mchip{font-size:13px;padding:1px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 17%,var(--sf));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.mmore{font-size:13px;color:var(--mu);padding-left:4px}
.mdots{display:none;gap:3px;flex-wrap:wrap;justify-content:center}.mdots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.selp{margin-top:14px}
@media(max-width:699px){.mc{min-height:62px;align-items:center;padding:5px 2px}.mchip,.mmore{display:none}.mdots{display:flex}.tbar h2{font-size:20px;flex-basis:100%;order:-1}.tbar .seg button{padding:0 11px}.tbar .navd{margin-left:auto}.tbar .navd .iconbtn{width:40px}}
/* finance */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px}
.kpi>span{font-size:14px;color:var(--mu);font-weight:650}
.kpi b{display:block;font-size:clamp(19px,2.3vw,28px);font-weight:800;letter-spacing:-.025em;white-space:nowrap;margin:4px 0 2px;overflow:hidden;text-overflow:ellipsis}
.kpi small{font-size:13px;color:var(--mu)}
.kpi.hero{background:var(--fin);border-color:transparent;color:var(--onc)}.kpi.hero>span,.kpi.hero small{color:inherit;opacity:.85}
.kpi.hero.neg{background:var(--bad)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media(max-width:900px){.g2{grid-template-columns:minmax(0,1fr)}}
.cbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;margin-bottom:12px;font-size:14.5px;align-items:center}
.cbar>span{display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cbar>b{white-space:nowrap;font-weight:700}
.cbar .bar{grid-column:1/-1;height:8px;border:0}
.m6{display:flex;align-items:stretch;gap:8px;height:190px;padding-top:6px}
.m6 .g{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.m6 .bs{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.m6 .bs i{width:min(20px,42%);border-radius:5px 5px 0 0;background:var(--fin);min-height:2px}.m6 .bs i.o{background:var(--trab)}

const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
/* three-way merge: base = last version both sides agreed on; local edits win over remote ones on the same field */
function merge3(b,l,r){
  if(same(l,b))return clone(r);
  if(same(r,b)||r===undefined)return clone(l);
  if(l===undefined)return clone(r);
  if(Array.isArray(l)&&Array.isArray(r)){
    const B=Array.isArray(b)?b:[],isId=a=>a.every(i=>i&&typeof i==='object'&&!Array.isArray(i)&&'id' in i);
    if(isId(l)&&isId(r)&&isId(B)){
      const bm=new Map(B.map(i=>[i.id,i])),lm=new Map(l.map(i=>[i.id,i])),rm=new Map(r.map(i=>[i.id,i])),out=[];
      for(const id of new Set([...r.map(i=>i.id),...l.map(i=>i.id)])){
        const bi=bm.get(id),li=lm.get(id),ri=rm.get(id);
        if(li&&ri)out.push(bi?merge3(bi,li,ri):clone(li));
        else if(li){if(bi&&same(bi,li))continue;out.push(clone(li))}
        else{if(bi&&same(bi,ri))continue;out.push(clone(ri))}

    }

      const k=x=>typeof x+':'+x,bs=new Set(B.map(k)),ls=new Set(l.map(k)),rs=new Set(r.map(k));

      return out;
    }
    return clone(l);
  }
  if(l&&r&&typeof l==='object'&&typeof r==='object'&&!Array.isArray(l)&&!Array.isArray(r)){
    const B=b&&typeof b==='object'&&!Array.isArray(b)?b:{},out={};
    for(const k of new Set([...Object.keys(r),...Object.keys(l)])){
      const iL=k in l,iR=k in r,iB=k in B;
      if(iL&&iR)out[k]=merge3(B[k],l[k],r[k]);
      else if(iL){if(iB&&same(B[k],l[k]))continue;out[k]=clone(l[k])}

}
const b64e=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function api(path,opt){
  opt=opt||{};
  const headers=Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH.token},opt.body?{'Content-Type':'application/json'}:{},opt.headers||{});
  try{return await fetch('https://api.github.com/repos/'+GH.repo+path,{method:opt.method||'GET',body:opt.body,headers,cache:'no-store'})}
  catch(e){const x=new Error('net');x.net=true;throw x}
}
const fail=r=>{const e=new Error('http '+r.status);e.status=r.status;return e};
async function getFile(id){
  const r=await api('/contents/data/'+id+'.json');
  if(r.status===404)return null;if(!r.ok)throw fail(r);
  const j=await r.json();let data;
  if(j.encoding==='base64'&&j.content){data=JSON.parse(b64d(j.content))}
  else{const rr=await api('/contents/data/'+id+'.json',{headers:{Accept:'application/vnd.github.raw+json'}});if(!rr.ok)throw fail(rr);data=await rr.json()}
  return{sha:j.sha,data:data&&typeof data==='object'&&!Array.isArray(data)?data:{}};
}
const recent=id=>skip[id]&&Date.now()-skip[id].t<120000;
async function pull(){
  const r=await api('/contents/data');let remote={};
  if(r.status===404){const rr=await api('');if(!rr.ok)throw fail(rr)}
  else if(!r.ok)throw fail(r);
  else{const l=await r.json();if(Array.isArray(l))for(const f of l)if(f.type==='file'&&/\.json$/.test(f.name)&&VALID.test(f.name.slice(0,-5)))remote[f.name.slice(0,-5)]=f.sha}
  let ch=false;
  for(const id in remote){
    const sha=remote[id];
    if(SHA[id]===sha||delq.has(id))continue;
    if(recent(id)&&skip[id].old===sha)continue;
    const f=await getFile(id);if(!f)continue;
    if(dirty.has(id))DOCS[id]=merge3(BASE[id],DOCS[id],f.data);else DOCS[id]=clone(f.data);
    BASE[id]=f.data;SHA[id]=f.sha;ch=true;
  }
  for(const id of Object.keys(SHA))if(!(id in remote)&&!recent(id)){delete SHA[id];delete BASE[id];if(!dirty.has(id)&&DOCS[id]){delete DOCS[id];ch=true}}
  return ch;
}
async function push(){
  for(const id of [...delq]){
    let sha=SHA[id];if(!sha){const f=await getFile(id);sha=f&&f.sha}
    if(sha){const r=await api('/contents/data/'+id+'.json',{method:'DELETE',body:JSON.stringify({message:'painel: apaga '+id,sha})});
      if(!r.ok&&r.status!==404){if(r.status===409||r.status===422){delete SHA[id];continue}throw fail(r)}}
    delq.delete(id);delete SHA[id];delete BASE[id];skip[id]={old:sha||null,t:Date.now()};
  }
  for(const id of [...dirty]){
    if(!DOCS[id]||!VALID.test(id)){dirty.delete(id);continue}
    for(let n=0;n<3;n++){
      const snap=JSON.stringify(DOCS[id]),body={message:'painel: '+id,content:b64e(JSON.stringify(DOCS[id],null,1))};
      if(SHA[id])body.sha=SHA[id];
      const r=await api('/contents/data/'+id+'.json',{method:'PUT',body:JSON.stringify(body)});
      if(r.ok){const j=await r.json();skip[id]={old:SHA[id]||null,t:Date.now()};SHA[id]=j.content.sha;BASE[id]=JSON.parse(snap);if(JSON.stringify(DOCS[id])===snap)dirty.delete(id);break}
      if(r.status===409||r.status===422){const f=await getFile(id);if(f){DOCS[id]=merge3(BASE[id],DOCS[id],f.data);BASE[id]=f.data;SHA[id]=f.sha}else delete SHA[id];continue}
      throw fail(r);
    }
  }
}
async function sync(){
  if(!GH.token||!GH.repo)return;
  if(syncing){again=true;return}
  if(navigator.onLine===false){setStatus('off');return}
  syncing=true;if(dirty.size||delq.size||!lastSync)setStatus('sync');
  try{
    const ch=await pull();await push();lastSync=Date.now();errMsg='';
    setStatus(dirty.size||delq.size?'sync':'ok');
    if(ch)render();
    if(!(DOCS.cfg&&DOCS.cfg.started)&&!$('#ov').classList.contains('on'))welcome();
  }catch(e){
    if(e.net){setStatus('off');errMsg=''}
    else if(e.status===401){setStatus('auth');errMsg='O token foi recusado (expirou ou foi apagado). Crie um novo e conecte de novo.'}
    else if(e.status===403){setStatus('err');errMsg='O GitHub recusou o acesso. Confira se o token tem permissão “Contents: Read and write” no repositório de dados, ou espere alguns minutos se o limite de uso foi atingido.'}
    else if(e.status===404){setStatus('auth');errMsg='Não encontrei o repositório '+GH.repo+' com esse token.'}
    else{setStatus('err');errMsg='O GitHub respondeu com erro ('+(e.status||e.message)+'). Vou tentar de novo sozinho.'}
  }
  syncing=false;persistNow();
  if(again){again=false;setTimeout(sync,400)}
}
function clearLocal(){for(const k of Object.keys(DOCS))delete DOCS[k];dirty.clear();delq.clear();BASE={};SHA={};skip={}}
async function connect(repo,token){
  repo=String(repo||'').trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/,'').replace(/\/+$/,'');token=String(token||'').trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo))throw new Error('Escreva o repositório no formato usuario/painel-dados.');
  if(!token)throw new Error('Cole o token do GitHub.');
  const prev=GH;GH={repo,token};
  const bail=m=>{GH=prev;return new Error(m)};
  let r;try{r=await api('')}catch(e){throw bail('Sem internet agora. Tente de novo quando estiver conectado.')}
  if(r.status===401)throw bail('O GitHub recusou esse token. Confira se copiou ele inteiro.');
  if(!r.ok)throw bail('Não encontrei '+repo+' com esse token. Confira o nome e se o token tem acesso a esse repositório.');
  const j=await r.json();
  if(!j.private)throw bail('Esse repositório é público: seus dados ficariam visíveis para qualquer pessoa. Use um repositório privado.');
  if(j.permissions&&j.permissions.push===false)throw bail('O token só pode ler. Dê a ele a permissão “Contents: Read and write”.');
  let hasRemote=false;const lr=await api('/contents/data');
  if(lr.ok){const l=await lr.json();hasRemote=Array.isArray(l)&&l.some(f=>/\.json$/.test(f.name))}
  try{localStorage.setItem(GHK,JSON.stringify(GH))}catch(e){}
  const reauth=prev.repo===repo;
  if(!reauth){BASE={};SHA={};skip={};delq.clear()}
  const hasLocal=!!(DOCS.cfg&&DOCS.cfg.started);
  return{hasRemote,hasLocal,reauth};
}
function disconnect(){GH={repo:'',token:''};try{localStorage.removeItem(GHK)}catch(e){}BASE={};SHA={};skip={};delq.clear();persistNow();setStatus('local')}
function afterConnect(res){
  const go=()=>{closeModal();toast('Conectado! Sincronizando…');sync().then(()=>{render()})};
  if(res.reauth){Object.keys(DOCS).forEach(k=>{if(VALID.test(k)&&!SHA[k])dirty.add(k)});persistNow();go()}
  else if(res.hasRemote&&res.hasLocal)confirmBox('Já existem dados no GitHub','Este aparelho também tem dados. O que fazer com eles?',[['Usar só os do GitHub',()=>{clearLocal();persistNow();render();go()}],['Juntar os dois',()=>{Object.keys(DOCS).forEach(k=>{if(VALID.test(k))dirty.add(k)});go()}]]);
  else{if(res.hasRemote)clearLocal();else Object.keys(DOCS).forEach(k=>{if(VALID.test(k))dirty.add(k)});persistNow();render();go()}
}

function occurs(e,day){
  if(!e.d||day<e.d)return false;if(e.until&&day>e.until)return false;if(Array.isArray(e.ex)&&e.ex.includes(day))return false;
  if(e.r==='d')return true;
  if(e.r==='w')return (Array.isArray(e.days)&&e.days.length?e.days:[dow(e.d)]).includes(dow(day));
  if(e.r==='m')return day.slice(8)===e.d.slice(8);

}

  const rec=(((DOCS['ag-rec']||{}).events)||[]).filter(e=>occurs(e,day));

}

function hrange(days){

  return [a,Math.min(24,b)];
}
function layout(ev){

  const out=[];let cl=[],cEnd=-1,ends=[];

  return out;
}

VR.habitos=()=>{
  const H=hab().habits,t=T();
  if(!H.length)return `<section class="card"><p class="empty" style="font-size:16px">Escolha 2 ou 3 hábitos para começar: estudar no Anki, treinar, ler, dormir mais cedo… Você marca cada dia e acompanha a sequência e a meta semanal.</p><button class="btn" data-act="habnew">${ic('plus')}Criar primeiro hábito</button></section>`;
  const days=[6,5,4,3,2,1,0].map(i=>addD(t,-i)),ws=weekStart(t);
  const done=H.filter(x=>isDone(x.id,t)).length,p=done/H.length,C=2*Math.PI*52;
  let gs=0,gd=0;H.forEach(x=>{const g=+x.goal||7;gs+=g;gd+=Math.min(weekCount(x.id,ws),g)});
  const f=pd(t.slice(0,7)+'-01'),mo=f.getMonth(),st=weekStart(ymd(f)),dim=new Date(f.getFullYear(),mo+1,0).getDate(),cells=Math.ceil((dd(st,ymd(f))+dim)/7)*7;
  let hmap=wdOrder().map(i=>`<span>${WD[i].charAt(0).toUpperCase()}</span>`).join('');
  for(let i=0;i<cells;i++){const x=addD(st,i);if(pd(x).getMonth()!==mo){hmap+='<i class="x"></i>';continue}
    if(x>t){hmap+=`<i>${pd(x).getDate()}</i>`;continue}
    const fr=H.filter(hh=>isDone(hh.id,x)).length/H.length;
    hmap+=`<i class="${x===t?'td':''} ${fr>.5?'hi':''}" style="background:color-mix(in srgb,var(--hab) ${Math.round(fr*88)}%,var(--sf2))" title="${fShort(x)}: ${Math.round(fr*100)}%">${pd(x).getDate()}</i>`}
  return `<div class="htop"><section class="card"><div class="ring"><svg viewBox="0 0 120 120" role="img" aria-label="${done} de ${H.length} hábitos hoje"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--sf2)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--hab)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 60 60)"/></svg><div><span class="mu">Hoje</span><b class="big">${done}/${H.length}</b><span>${done===H.length?'Tudo feito hoje!':'hábitos feitos'}</span><p class="mu" style="margin:8px 0 0;font-size:14px">Metas da semana: <b style="color:var(--ink)">${gs?Math.round(gd/gs*100):0}%</b></p></div></div></section>
  <section class="card"><header><h3>${cap(MOF[mo])}</h3><span class="mu" style="font-size:13px">mais escuro = mais hábitos feitos</span></header><div class="hm">${hmap}</div></section></div>
  <section class="card"><header><h3>Seus hábitos</h3><button class="btn sm" data-act="habnew">${ic('plus')}Hábito</button></header>
  <div class="hrow hhead"><span class="hn"></span>${days.map(d=>`<span class="${d===t?'td':''}">${WD[dow(d)]}<b>${pd(d).getDate()}</b></span>`).join('')}<span class="hs">semana</span></div>
  ${H.map(x=>{const c=col(x.color),g=+x.goal||7,wc=weekCount(x.id,ws),sk=g===7?streak(x.id):wkStreak(x.id,g);return `<div class="hrow"><button class="hn" data-act="habedit" data-id="${h(x.id)}"><b><i class="dot" style="--c:${c}"></i>${h(x.name)}</b><span>${g===7?'todo dia':g+'x por semana'}</span></button>${days.map(d=>{const on=isDone(x.id,d);return `<button class="hc ${on?'on':''}" style="--c:${c}" data-act="htog" data-id="${h(x.id)}" data-day="${d}" aria-pressed="${on}" aria-label="${h(x.name)}, ${fShort(d)}">${on?ic('check'):''}</button>`}).join('')}<div class="hs"><b>${wc}/${g}</b>${sk?ic('flame')+' '+(g===7?plural(sk,'dia','dias'):plural(sk,'semana','semanas')):'sem sequência'}</div></div>`}).join('')}</section>`;
};

function render(){
  const tw=document.querySelector('.tgwrap'),st=tw?tw.scrollTop:null,stl=tw?tw.scrollLeft:0;
  document.body.dataset.v=view;
  document.querySelectorAll('.nv[data-v],.tb').forEach(a=>{a.classList.toggle('on',a.dataset.v===view);if(a.dataset.v===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const c=cfg(),hr=new Date().getHours();
  $('#ttl').textContent=view==='hoje'?(hr<5||hr>=18?'Boa noite':hr<12?'Bom dia':'Boa tarde')+(c.name?', '+c.name:''):VIEWS.find(v=>v[0]===view)[1];
  $('#kick').textContent=view==='hoje'?cap(fLong(T())):'';
  $('#bdate').textContent=cap(fLong(T()));
  let html='';
  try{html+=VR[view]()}catch(e){console.error(e);html+=`<div class="note"><span>Algo deu errado ao mostrar esta seção.</span></div>`}
  $('#content').innerHTML=html;
  const w=document.querySelector('.tgwrap');
  if(w){
    if(needScroll||st===null){const h0=+w.dataset.h0||0,days=[...w.querySelectorAll('.dcol')].map(x=>x.dataset.day),isT=days.includes(T()),y=((isT?nowMin():8*60)/60-h0)*HH;w.scrollTop=Math.max(0,y-(isT?w.clientHeight/3:20))}
    else{w.scrollTop=st;w.scrollLeft=stl}
  }
  needScroll=false;
}
function go(v){if(view===v){needScroll=true;render()}else location.hash=v}

const SUB={};
SUB.ev=fd=>{
  const id=fd.get('id')||nid(),o={id,t:str(fd,'t'),d:fd.get('d'),all:!!fd.get('all'),s:fd.get('s')||'09:00',e:fd.get('e')||'',c:CATS[fd.get('c')]?fd.get('c'):'pessoal',n:str(fd,'n')};
  if(!o.t||!/^\d{4}-\d{2}-\d{2}$/.test(o.d||''))return toast('Preencha título e data.');
  const r=fd.get('r');
  if(r){o.r=r;if(r==='w'){o.days=fd.getAll('wd').map(Number);if(!o.days.length)o.days=[dow(o.d)]}const u=fd.get('until');if(u&&u>=o.d)o.until=u}
  const old=findEv(id);
  if(old){if(o.r&&Array.isArray(old.ev.ex))o.ex=old.ev.ex;DOCS[old.k].events.splice(old.i,1);save(old.k)}
  const k=o.r?'ag-rec':'ag-'+o.d.slice(0,4);agDoc(k).events.push(o);save(k);
  fin(old?'Evento atualizado':'Evento criado');
};
SUB.fac=fd=>{
  const F=facul(),id=fd.get('id'),o={t:str(fd,'t'),sub:fd.get('sub')||'',due:fd.get('due')||'',type:FT.includes(fd.get('type'))?fd.get('type'):'Outro',n:str(fd,'n')};
  if(!o.t)return;
  if(id){const t=F.tasks.find(x=>x.id===id);if(t){const was=t.done;Object.assign(t,o);t.done=!!fd.get('done');if(t.done&&!was)t.doneAt=T()}}
  else F.tasks.push(Object.assign({id:nid(),done:false},o));
  save('facul');fin('Pendência salva');
};
SUB.trab=fd=>{
  const L=trab().tasks,id=fd.get('id'),o={t:str(fd,'t'),pri:PRI[fd.get('pri')]?fd.get('pri'):'m',due:fd.get('due')||'',st:STL[fd.get('st')]?fd.get('st'):'todo',n:str(fd,'n')};
  if(!o.t)return;
  if(id){const t=L.find(x=>x.id===id);if(t){if(o.st==='done'&&t.st!=='done')o.doneAt=T();Object.assign(t,o)}}
  else{if(o.st==='done')o.doneAt=T();L.push(Object.assign({id:nid()},o))}
  save('trab');fin('Pendência salva');
};
SUB.tx=fd=>{
  const v=parseMoney(fd.get('v')),k=fd.get('k')==='in'?'in':'out',d=fd.get('d');
  if(!(v>0))return toast('Informe um valor maior que zero.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return toast('Informe a data.');
  const id=fd.get('id')||nid(),o={id,k,v,d,desc:str(fd,'desc'),cat:k==='in'?fd.get('cin'):fd.get('cout')};
  const old=findTx(id);if(old){DOCS[old.k].tx.splice(old.i,1);save(old.k)}
  finDoc(d.slice(0,4)).tx.push(o);save('fin-'+d.slice(0,4));
  ui.finM=d.slice(0,7);fin(old?'Lançamento atualizado':'Lançamento salvo');
};
SUB.inv=fd=>{
  const ap=parseMoney(fd.get('applied'));let cur=parseMoney(fd.get('current'));
  if(!(ap>=0))return toast('Informe o valor aplicado.');if(!(cur>=0))cur=ap;
  const L=inv().items,id=fd.get('id'),o={name:str(fd,'name'),type:ITY.includes(fd.get('type'))?fd.get('type'):'Outros',applied:ap,current:cur,up:T()};
  if(!o.name)return;
  if(id){const x=L.find(i=>i.id===id);if(x)Object.assign(x,o)}else L.push(Object.assign({id:nid()},o));
  save('inv');fin('Investimento salvo');
};
SUB.hab=fd=>{
  const L=hab().habits,id=fd.get('id'),g=Math.max(1,Math.min(7,+fd.get('goal')||7)),o={name:str(fd,'name'),goal:g,color:col(fd.get('color'))};
  if(!o.name)return;
  if(id){const x=L.find(i=>i.id===id);if(x)Object.assign(x,o)}else L.push(Object.assign({id:nid()},o));
  save('hab');fin('Hábito salvo');
};
SUB.subs=fd=>{
  const ids=fd.getAll('sid'),ns=fd.getAll('sn'),cs=fd.getAll('sc');
  facul().subs=ids.map((id,i)=>({id:String(id),name:String(ns[i]||'').trim(),color:col(cs[i])})).filter(s=>s.name);
  save('facul');fin('Disciplinas salvas');
};
SUB.cfg=fd=>{
  const c=cfg(),b=parseMoney(fd.get('budget'));
  c.name=str(fd,'name');c.budget=b>0?b:0;c.ws=+fd.get('ws')===1?1:0;c.h0=+fd.get('h0')||0;c.h1=Math.max(c.h0+1,+fd.get('h1')||24);
  save('cfg');fin('Ajustes salvos');
};
SUB.welcome=(fd,f,sb)=>{
  const name=str(fd,'name');
  if(sb&&sb.value==='ex')seed(name);
  else{const c=cfg();c.name=name;c.started=true;save('cfg')}
  fin(sb&&sb.value==='ex'?'Exemplo carregado':'Tudo pronto!');
};
SUB.gh=async(fd,f)=>{
  const b=f.querySelector('button:not([type])'),m=f.querySelector('.ghmsg');b.disabled=true;b.textContent='Conectando…';m.textContent='';
  try{afterConnect(await connect(fd.get('repo'),fd.get('token')))}catch(e){m.textContent=e.message;b.disabled=false;b.textContent='Conectar'}
};
SUB.restore=fd=>{
  let o;try{o=JSON.parse(fd.get('j'))}catch(e){return toast('Esse texto não é um backup válido.')}
  if(!o||typeof o!=='object'||Array.isArray(o))return toast('Esse texto não é um backup válido.');
  const re=/^(cfg|facul|trab|hab|inv|ag-rec|ag-\d{4}|fin-\d{4})$/;let n=0;
  for(const k in o)if(re.test(k)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])){DOCS[k]=o[k];save(k);n++}
  if(!n)return toast('Não encontrei dados do painel nesse texto.');
  cfg().started=true;save('cfg');fin('Backup restaurado');
};

    render();if(doneNow)toast('Concluída');
  },
  tmove:el=>{const t=trab().tasks.find(x=>x.id===el.dataset.id);if(!t)return;const o=['todo','doing','done'],i=Math.max(0,Math.min(2,o.indexOf(t.st||'todo')+(+el.dataset.dir)));setSt(t.id,o[i]);if(isMob()&&o[i]!==ui.trabCol)toast('Movida para “'+STL[o[i]]+'”')},
  trabcol:el=>{ui.trabCol=el.dataset.c;saveUi();render()},
  trabclear:()=>confirmBox('Limpar concluídas?','As pendências concluídas do trabalho serão apagadas.',[['Limpar',()=>{if(!ok())return;const T_=trab();T_.tasks=T_.tasks.filter(x=>x.st!=='done');save('trab');fin('Concluídas removidas')},'danger']]),
  htog:el=>{if(!ok())return;const {id,day}=el.dataset;if(day>T())return;const H=hab();if(!Array.isArray(H.log[id]))H.log[id]=[];const a=H.log[id],i=a.indexOf(day);if(i>=0)a.splice(i,1);else a.push(day);save('hab');render()},
  facsub:el=>{ui.facSub=el.dataset.s;saveUi();render()},
  finshift:el=>{ui.finM=addM(ui.finM,+el.dataset.k);render()},
  finf:el=>{ui.finF=el.dataset.f;saveUi();render()},
  subadd:()=>{const w=$('#subrows');w.insertAdjacentHTML('beforeend',subRow());const ins=w.querySelectorAll('input[type=text]');ins[ins.length-1].focus()},
  subdel:el=>el.closest('.subr').remove(),
  bkcopy:()=>{const txt=JSON.stringify(DOCS);const fb=()=>open(`<h2>Backup</h2><p class="mu" style="margin-top:-6px">Selecione todo o texto abaixo, copie e guarde num lugar seguro.</p><textarea readonly style="min-height:220px;font-size:13px">${h(txt)}</textarea><div class="acts"><button type="button" class="btn" data-act="mclose">Fechar</button></div>`);try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copiado. Cole numa nota para guardar.'),fb)}catch(e){fb()}},
  bkrest:()=>open(`<form data-form="restore"><h2>Restaurar backup</h2><p class="mu" style="margin-top:-6px">Cole o texto do backup. As áreas presentes nele substituem as atuais.</p><label class="fld"><span>Texto do backup</span><textarea name="j" required style="min-height:180px;font-size:13px"></textarea></label><div class="acts"><button type="button" class="btn ghost" data-act="mclose">Cancelar</button><button class="btn">Restaurar</button></div></form>`),
  reset:()=>confirmBox(cfg().sample?'Apagar o exemplo?':'Apagar todos os dados?',cfg().sample?'Os dados de exemplo serão apagados e você começa do zero.':'Agenda, finanças, faculdade, trabalho e hábitos serão apagados em todos os seus aparelhos. Se quiser, copie um backup antes.',[['Apagar',()=>{if(!ok())return;resetAll()},'danger']]),
};
function setSt(id,st){if(!ok())return;const t=trab().tasks.find(x=>x.id===id);if(!t||t.st===st)return;t.st=st;if(st==='done')t.doneAt=T();save('trab');render()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='ov'){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#ov').classList.contains('on'))closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.mc[data-act]')){e.preventDefault();ACT.agsel(e.target)}
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();
  const fn=SUB[f.dataset.form];if(!fn||!ok())return;fn(new FormData(f),f,e.submitter);
});
document.addEventListener('change',e=>{
  const f=e.target.form;if(!f)return;
  if(e.target.name==='r')f.dataset.r=e.target.value;
  if(e.target.name==='all')f.classList.toggle('is-all',e.target.checked);
  if(e.target.name==='k')f.dataset.k=e.target.value;
});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();document.querySelectorAll('.kcol.over').forEach(x=>{if(x!==z)x.classList.remove('over')});z.classList.add('over')});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id)setSt(id,z.dataset.drop)});
document.addEventListener('dragend',()=>document.querySelectorAll('.kcol.over').forEach(x=>x.classList.remove('over')));
let lastDay=T();
setInterval(()=>{if(document.visibilityState!=='visible'||$('#ov').classList.contains('on'))return;if(T()!==lastDay){lastDay=T();ui.agDate=ui.agSel=T();ui.finM=T().slice(0,7)}if(view==='hoje'||view==='agenda')render()},60000);

loadState();renderNav();setStatus(GH.token?'sync':'local');render();
setInterval(()=>{if(document.visibilityState==='visible')sync()},20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync();else persistNow()});
addEventListener('online',()=>sync());addEventListener('offline',()=>{if(GH.token)setStatus('off')});
addEventListener('pagehide',persistNow);
if(location.hash.startsWith('#conectar=')){
  const raw=location.hash.slice(10);history.replaceState(null,'',location.pathname+location.search+'#hoje');
  let o=null;try{o=JSON.parse(ub64(raw))}catch(e){}
  if(o&&o.r&&o.t){open('<h2>Conectando…</h2><p class="mu" style="margin-top:-6px">Ligando este aparelho ao seu painel.</p>');connect(o.r,o.t).then(afterConnect).catch(e=>ghForm(!(DOCS.cfg&&DOCS.cfg.started),e.message))}
  else{toast('Link de conexão inválido.');if(GH.token)sync();else if(!(DOCS.cfg&&DOCS.cfg.started))welcome()}
}else if(GH.token)sync();else if(!(DOCS.cfg&&DOCS.cfg.started))welcome();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
